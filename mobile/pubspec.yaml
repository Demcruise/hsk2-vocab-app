name: kunkwan_hsk2
description: Kunkwan HSK 2 — aplikasi belajar kosakata gaya Duolingo.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  flutter_svg: ^2.0.10+1
  share_plus: ^10.1.0
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/audio/
    - assets/svg/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Var.ttf
